# Terraria-Theme-Hyprland keybindings (Rule A5)
# All bindings communicating with Quickshell use `qs ipc call ...`

$mainMod = SUPER

# Inventory toggle (DESIGN.md 3.2: tap Super / keybind)
# bind = $mainMod, SUPER_L, exec, qs ipc call inventory toggle

# Hotbar slots 1-10 (DESIGN.md 3.1: Super + 1..0)
# bind = $mainMod, 1, exec, qs ipc call hotbar slot 1
# bind = $mainMod, 2, exec, qs ipc call hotbar slot 2
# bind = $mainMod, 3, exec, qs ipc call hotbar slot 3
# bind = $mainMod, 4, exec, qs ipc call hotbar slot 4
# bind = $mainMod, 5, exec, qs ipc call hotbar slot 5
# bind = $mainMod, 6, exec, qs ipc call hotbar slot 6
# bind = $mainMod, 7, exec, qs ipc call hotbar slot 7
# bind = $mainMod, 8, exec, qs ipc call hotbar slot 8
