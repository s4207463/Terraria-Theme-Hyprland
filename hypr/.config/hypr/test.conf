# Hyprland test configuration for nested session testing (Rule A5 & B4)
# Run with: Hyprland -c "$PWD/hypr/.config/hypr/test.conf"

# Virtual monitor in a window (sized to fit comfortably on screen)
monitor = , 1600x900@60, auto, 1

# Autostart the Terraria Quickshell instance inside this virtual session
exec-once = /home/evrotheskid/.local/bin/quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell"

# Inventory toggle inside nested window:
# - Standalone modifier tap (empty modifier before comma so release triggers):
bindr = , Super_L, exec, /home/evrotheskid/.local/bin/quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle
bindr = , Alt_L, exec, /home/evrotheskid/.local/bin/quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle
bindr = , Alt_R, exec, /home/evrotheskid/.local/bin/quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle
# - Dedicated keys (Escape is Terraria default, F1 / Alt+I for convenience):
bind = , Escape, exec, /home/evrotheskid/.local/bin/quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle
bind = , F1, exec, /home/evrotheskid/.local/bin/quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle
bind = ALT, I, exec, /home/evrotheskid/.local/bin/quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle

# Quick close for nested test session: ALT + Shift + Q
bind = ALT SHIFT, Q, exit

# Completely disable all compositor animations (zero fade, zero slide, instant snap like Terraria)
animations {
    enabled = false
}
