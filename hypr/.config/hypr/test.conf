# Hyprland test configuration for nested session testing (Rule A5 & B4)
# Run with: Hyprland -c "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/hypr/.config/hypr/test.conf"

# Virtual monitor in a window
monitor = , 1920x1080@60, auto, 1

# Autostart the Terraria Quickshell instance inside this virtual session
exec-once = quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell"

# Source repository keybinds (SUPER_L toggle)
source = /home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/hypr/.config/hypr/keybinds.conf

# Also allow ALT_L tap inside nested window so host SUPER does not collide
bindr = ALT, ALT_L, exec, quickshell ipc -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" call inventory toggle

# Quick close for nested test session: ALT + Shift + Q
bind = ALT SHIFT, Q, exit

