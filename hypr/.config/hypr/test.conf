# Hyprland test configuration for nested session testing (Rule A5 & B4)
# Run with: Hyprland -c "$PWD/hypr/.config/hypr/test.conf"

# Virtual monitor in a window (sized to fit comfortably on screen)
monitor = , 1600x900@60, auto, 1

# Autostart the Terraria Quickshell instance inside this virtual session
exec-once = quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell"

# Inventory toggle inside nested window:
# - SUPER_L (for actual behavior test)
# - ALT_L (in case host Hyprland intercepts SUPER)
# - 'I' or 'F1' (quick key toggle without modifier conflict)
bindr = SUPER, SUPER_L, exec, quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle
bindr = ALT, ALT_L, exec, quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle
bind = , F1, exec, quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle
bind = ALT, I, exec, quickshell -p "/home/evrotheskid/Terraria Project/Terraria-Theme-Hyprland/quickshell/.config/quickshell" ipc call inventory toggle

# Quick close for nested test session: ALT + Shift + Q
bind = ALT SHIFT, Q, exit

# Completely disable all compositor animations (zero fade, zero slide, instant snap like Terraria)
animations {
    enabled = false
}
